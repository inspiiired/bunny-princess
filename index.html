<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для моей лучшей girl</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #ffe0f0 0%, #e0f7ff 50%, #f0e0ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 20px;
  }

  .heart-bg {
    position: fixed;
    font-size: 24px;
    opacity: 0.4;
    animation: floatUp linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 32px;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 150, 200, 0.3),
                0 0 0 4px rgba(255, 255, 255, 0.5) inset;
    position: relative;
    z-index: 1;
    border: 2px solid rgba(255, 182, 220, 0.5);
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .avatar {
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    position: relative;
    animation: bounce 2.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .ear {
    position: absolute;
    width: 26px;
    height: 62px;
    background: #fff;
    border: 3px solid #f5b8d8;
    border-radius: 50% 50% 40% 40%;
    top: 2px;
    z-index: 1;
  }
  .ear::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 40px;
    background: #ffd6e8;
    border-radius: 50%;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
  }
  .ear.left {
    left: 22px;
    transform: rotate(-12deg);
    transform-origin: bottom center;
  }
  .ear.right {
    right: 22px;
    transform: rotate(12deg);
    transform-origin: bottom center;
  }

  .head {
    position: absolute;
    width: 110px;
    height: 100px;
    background: #fff;
    border: 3px solid #f5b8d8;
    border-radius: 50%;
    left: 50%;
    top: 40px;
    transform: translateX(-50%);
    z-index: 2;
    box-shadow: 0 4px 12px rgba(255, 150, 200, 0.2);
  }

  .eye {
    position: absolute;
    width: 13px;
    height: 13px;
    background: #4a3b52;
    border-radius: 50%;
    top: 36px;
    animation: blink 4s infinite;
  }
  .eye.left { left: 22px; }
  .eye.right { right: 22px; }
  .eye::after {
    content: '';
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    top: 2px;
    left: 3px;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  .blush {
    position: absolute;
    width: 18px;
    height: 10px;
    background: #ffb3d1;
    border-radius: 50%;
    top: 56px;
    opacity: 0.7;
    filter: blur(1px);
  }
  .blush.left { left: 12px; }
  .blush.right { right: 12px; }

  .nose {
    position: absolute;
    width: 10px;
    height: 8px;
    background: #ff9ec4;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    top: 54px;
    left: 50%;
    transform: translateX(-50%);
  }

  .mouth {
    position: absolute;
    width: 16px;
    height: 8px;
    border-bottom: 2.5px solid #ff9ec4;
    border-radius: 0 0 50% 50%;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
  }

  .whisker {
    position: absolute;
    width: 20px;
    height: 2px;
    background: #f5b8d8;
    top: 60px;
    border-radius: 2px;
  }
  .whisker.left { left: -8px; transform: rotate(-8deg); }
  .whisker.right { right: -8px; transform: rotate(8deg); }

  .bow {
    position: absolute;
    top: 34px;
    right: 8px;
    z-index: 3;
    font-size: 22px;
    filter: drop-shadow(0 2px 4px rgba(255, 100, 170, 0.4));
    animation: wiggle 2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }


  h1 {
    font-size: 26px;
    color: #d63384;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 15px;
    color: #a06cb5;
    margin-bottom: 24px;
    font-style: italic;
  }

  .message {
    background: linear-gradient(135deg, #fff0f7, #f0f4ff);
    border-radius: 20px;
    padding: 20px;
    font-size: 15px;
    color: #6a4c7a;
    line-height: 1.6;
    margin-bottom: 24px;
    border: 2px dashed #ffc2e0;
  }

  .btn {
    background: linear-gradient(135deg, #ff9ecb, #c79eff);
    color: white;
    border: none;
    padding: 14px 36px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 150, 200, 0.5);
    transition: all 0.3s;
    font-family: inherit;
    letter-spacing: 0.5px;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 28px rgba(255, 150, 200, 0.7);
  }
  .btn:active {
    transform: translateY(0) scale(0.98);
  }

  .secret {
    margin-top: 20px;
    font-size: 17px;
    color: #d63384;
    font-weight: bold;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-height: 24px;
  }
  .secret.show {
    opacity: 1;
    transform: scale(1);
  }

  .confetti {
    position: fixed;
    font-size: 20px;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall 1.5s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #b89cc9;
  }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; border-radius: 24px; }
    h1 { font-size: 22px; }
    .avatar { transform: scale(0.9); }
  }
</style>
</head>
<body>

<div class="heart-bg" style="left: 5%; animation-duration: 12s; animation-delay: 0s;">💖</div>
<div class="heart-bg" style="left: 20%; animation-duration: 15s; animation-delay: 2s;">🌸</div>
<div class="heart-bg" style="left: 40%; animation-duration: 10s; animation-delay: 4s;">✨</div>
<div class="heart-bg" style="left: 60%; animation-duration: 14s; animation-delay: 1s;">💕</div>
<div class="heart-bg" style="left: 80%; animation-duration: 11s; animation-delay: 3s;">🌷</div>
<div class="heart-bg" style="left: 90%; animation-duration: 16s; animation-delay: 5s;">💗</div>

<div class="card">

  <div class="avatar">
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="blush left"></div>
      <div class="blush right"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
      <div class="whisker left"></div>
      <div class="whisker right"></div>
    </div>
    <div class="bow">🎀</div>
  </div>

  <h1>Привет, додо!</h1>
  <p class="subtitle">Это сделано специально для тебя чтобы убрать твою депрешн ₍ᐢ..ᐢ₎♡</p>

  <div class="message">
    Ты самая милая, самая красивая, самая нежная, самая прекрасная, самая чудесная и восхитительная девочка на свете!!! 💕<br>
    Пусть твоя депрешн уйдет<br>
    А это кролик антидепрешн 🐰
  </div>


  <button class="btn" onclick="surprise()">Жми сюда скорее ♡</button>

  <div class="secret" id="secret"></div>

  <div class="footer">Сделано специально для додо ♡</div>
</div>

<script>
  const messages = [
    "Ты мое счастье! 💖",
    "Поменьше депрешн! 💞",
    "Мы справимся со всем вместе! ✨",
    "Ты для меня номер 1! 🌹",
    "Будь такой же яркой, как это солнышко! ☀️",
    "Ты большая умничка! 🍓",
    "Чмокаю тебя! 😘",
    "Ты моя милая банни принцесс! 🐰"
  ];

  const emojis = ['😍', '🌸', '🐾', '💕', '🎀', '🌹', '💗', '💐', '💍', '🍓', '🐰'];

  function surprise() {
    const secret = document.getElementById('secret');
    const randomMsg = messages[Math.floor(Math.random() * messages.length)];
    secret.textContent = randomMsg;
    secret.classList.add('show');

    secret.style.animation = 'none';
    secret.offsetHeight;
    secret.style.animation = '';

    for (let i = 0; i < 12; i++) {
      createConfetti();
    }
  }

  function createConfetti() {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-30px';
    el.style.animationDuration = (1 + Math.random() * 1) + 's';
    el.style.fontSize = (16 + Math.random() * 20) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
</script>
</body>
</html>
